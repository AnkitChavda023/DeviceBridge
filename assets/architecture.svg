<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="920" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DeviceBridge architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="780" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">DeviceBridge architecture</text>

  <rect x="20" y="52" width="880" height="96" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="34" y="74" font-size="12" font-weight="700" fill="#0969da" letter-spacing="1">1  APPLICATIONS</text>
  <rect x="60" y="88" width="240" height="46" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="180" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">device_monitor</text>
  <text x="180" y="125" text-anchor="middle" font-size="12" fill="#57606a">command line tool</text>
  <rect x="340" y="88" width="240" height="46" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="460" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">examples</text>
  <text x="460" y="125" text-anchor="middle" font-size="12" fill="#57606a">temperature_reader, event_subscriber</text>
  <rect x="620" y="88" width="240" height="46" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="740" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">your application</text>
  <text x="740" y="125" text-anchor="middle" font-size="12" fill="#57606a">links the framework library</text>


  <rect x="20" y="168" width="880" height="196" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="34" y="190" font-size="12" font-weight="700" fill="#1a7f37" letter-spacing="1">2  MANAGER LAYER</text>

  <rect x="40" y="204" width="250" height="62" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="165" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">ConfigManager + DeviceFactory</text>
  <text x="165" y="247" text-anchor="middle" font-size="12" fill="#57606a">reads config/*.yaml, builds devices</text>

  <rect x="335" y="204" width="250" height="62" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="460" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">DeviceManager</text>
  <text x="460" y="247" text-anchor="middle" font-size="12" fill="#57606a">register, open, read, configure, recover</text>

  <rect x="630" y="204" width="250" height="62" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="755" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">EventManager</text>
  <text x="755" y="247" text-anchor="middle" font-size="12" fill="#57606a">bounded queue, one dispatcher thread</text>



  <rect x="335" y="292" width="250" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="460" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">DeviceRegistry</text>
  <text x="460" y="333" text-anchor="middle" font-size="12" fill="#57606a">thread-safe lookup by device id</text>

  <rect x="630" y="292" width="250" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="755" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Subscribers</text>
  <text x="755" y="333" text-anchor="middle" font-size="12" fill="#57606a">your callbacks, never block devices</text>


  <rect x="20" y="364" width="880" height="170" rx="10" fill="#fff1e5" stroke="#fb8f44"/>
  <text x="34" y="386" font-size="12" font-weight="700" fill="#bc4c00" letter-spacing="1">3  DEVICES</text>

  <rect x="45" y="412" width="195" height="50" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="142" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">TemperatureDevice</text>
  <text x="142" y="451" text-anchor="middle" font-size="12" fill="#57606a">4-byte frame, celsius</text>
  <rect x="260" y="412" width="195" height="50" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="357" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">AccelerometerDevice</text>
  <text x="357" y="451" text-anchor="middle" font-size="12" fill="#57606a">8-byte frame, range 2-16 g</text>
  <rect x="475" y="412" width="195" height="50" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="572" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">GpsDevice</text>
  <text x="572" y="451" text-anchor="middle" font-size="12" fill="#57606a">NMEA GGA / RMC lines</text>
  <rect x="690" y="412" width="195" height="50" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="787" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">VirtualSensorDevice</text>
  <text x="787" y="451" text-anchor="middle" font-size="12" fill="#57606a">raw bytes + ioctl</text>

  <rect x="45" y="480" width="825" height="40" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-dasharray="5 4"/>
  <text x="457" y="498" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">All devices derive from DeviceBase</text>
  <text x="457" y="513" text-anchor="middle" font-size="11.5" fill="#57606a">lifecycle state machine, counters, error handling, event worker thread, capability interfaces</text>


  <rect x="20" y="566" width="880" height="86" rx="10" fill="#fbefff" stroke="#c297ff"/>
  <text x="34" y="587" font-size="12" font-weight="700" fill="#8250df" letter-spacing="1">4  TRANSPORTS (ITransport)</text>
  <rect x="60" y="598" width="240" height="44" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="180" y="617" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">VirtualTransport</text>
  <text x="180" y="633" text-anchor="middle" font-size="12" fill="#57606a">in-memory buffer</text>
  <rect x="340" y="598" width="240" height="44" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="460" y="617" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">CharacterDeviceTransport</text>
  <text x="460" y="633" text-anchor="middle" font-size="12" fill="#57606a">open, read, write, poll, ioctl</text>
  <rect x="620" y="598" width="240" height="44" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="740" y="617" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">TtyTransport</text>
  <text x="740" y="633" text-anchor="middle" font-size="12" fill="#57606a">serial port, termios raw mode</text>


  <rect x="20" y="678" width="880" height="86" rx="10" fill="#f6f8fa" stroke="#afb8c1"/>
  <text x="34" y="699" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1">5  BELOW THE FRAMEWORK</text>
  <rect x="60" y="710" width="240" height="44" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="180" y="729" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Simulators</text>
  <text x="180" y="745" text-anchor="middle" font-size="12" fill="#57606a">temp, accel, GPS + fault injection</text>
  <rect x="340" y="710" width="240" height="44" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="460" y="729" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">/dev/vdev0</text>
  <text x="460" y="745" text-anchor="middle" font-size="12" fill="#57606a">Linux kernel module (C): virtual_device.c</text>
  <rect x="620" y="710" width="240" height="44" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="740" y="729" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Serial port</text>
  <text x="740" y="745" text-anchor="middle" font-size="12" fill="#57606a">/dev/ttyUSB0 or a pseudo-terminal</text>

  <g>
  <path d="M 180 134 V 156 H 460" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <path d="M 740 134 V 156 H 460" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <path d="M 460 134 V 168" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 290 235 H 333" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="226" text-anchor="middle" font-size="10" fill="#57606a">registers</text>
  <path d="M 587 235 H 628" fill="none" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="608" y="226" text-anchor="middle" font-size="10" fill="#57606a">events</text>
  <path d="M 460 266 V 292" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="283" font-size="10" fill="#57606a">lookup</text>
  <path d="M 755 266 V 292" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="765" y="283" font-size="10" fill="#57606a">deliver</text>
  <path d="M 460 348 V 388" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <path d="M 142 388 H 787" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <path d="M 142 388 V 412" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 357 388 V 412" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 572 388 V 412" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 787 388 V 412" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="381" font-size="10" fill="#57606a">holds the devices</text>
  <path d="M 457 534 V 566" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="467" y="554" font-size="10" fill="#57606a">talk to the world only through ITransport</text>
  <path d="M 180 642 V 678" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 460 642 V 678" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 740 642 V 678" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>
